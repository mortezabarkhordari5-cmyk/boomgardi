<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ایران‌جا | سامانه جامع بوم‌گردی و رزرو اقامتگاه</title>

  <!-- فونت وزیرمتن -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8fafc; color: #1e293b; direction: rtl; }
    header { background: #0f766e; color: white; padding: 1.5rem; text-align: center; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    header p { font-size: 0.95rem; opacity: 0.9; }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .top-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;
    }

    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn-host {
      background: #0284c7; color: white; border: none; padding: 0.75rem 1.25rem;
      border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-host:hover { background: #0369a1; }

    .btn-admin {
      background: #475569; color: white; border: none; padding: 0.75rem 1.25rem;
      border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-admin:hover { background: #334155; }

    .search-box {
      background: white; padding: 1rem; border-radius: 12px;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
      display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;
      align-items: center;
    }

    .search-box input, .search-box select {
      flex: 1; min-width: 180px;
      padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 1rem; outline: none;
    }

    .search-box button {
      background: #0d9488; color: white; border: none; padding: 0.75rem 1.5rem;
      border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
      white-space: nowrap;
    }
    .search-box button:hover { background: #0f766e; }

    .statusbar {
      margin-bottom: 1.25rem; display: flex; gap: .75rem; flex-wrap: wrap;
      align-items: center; color: #475569; font-size: .95rem;
    }
    .badge {
      background: #dcfce7; color: #166534; padding: .35rem .7rem; border-radius: 999px; font-weight: 500;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgb(0 0 0 / 0.08); transition: transform 0.2s; display: flex; flex-direction: column; position: relative; }
    .card:hover { transform: translateY(-4px); }

    .card img { width: 100%; height: 180px; object-fit: cover; background: #cbd5e1; }
    .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }

    .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; color: #0f172a; }
    .card-location { font-size: 0.85rem; color: #64748b; margin-bottom: 0.8rem; }
    .card-price { font-size: 1.1rem; font-weight: bold; color: #0d9488; margin-top: auto; margin-bottom: 1rem; }

    .btn-reserve {
      display: block; width: 100%; text-align: center;
      background: #f0fdfa; color: #0d9488; border: 1px solid #0d9488;
      padding: 0.6rem; border-radius: 8px; text-decoration: none;
      font-weight: bold; transition: all 0.2s; cursor: pointer;
    }
    .btn-reserve:hover { background: #0d9488; color: white; }

    /* Modal Form Styling */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 1rem; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 2rem; border-radius: 16px; width: 100%; max-width: 500px;
      box-shadow: 0 4px 20px rgb(0 0 0 / 0.15); max-height: 90vh; overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 1rem; color: #0f766e; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .modal-actions button { flex: 1; padding: 0.75rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-submit { background: #0d9488; color: white; }
    .btn-cancel { background: #e2e8f0; color: #334155; }

    /* Admin Management List inside Modal */
    .admin-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 0; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; gap: 0.5rem;
    }
    .btn-delete-prop {
      background: #fee2e2; color: #991b1b; border: none; padding: 0.4rem 0.8rem;
      border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap;
    }
    .btn-delete-prop:hover { background: #fecaca; }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem; color: #64748b; font-size: 1.1rem; }
  </style>
</head>

<body>
  <header>
    <h1>ایران‌جا 🌲</h1>
    <p>سامانه جامع رزرو بوم‌گردی و کسب درآمد از گردشگری</p>
  </header>

  <div class="container">
    
    <!-- دکمه‌های مدیریتی و میزبانی -->
    <div class="top-actions">
      <div class="statusbar" style="margin: 0;">
        <span class="badge">وضعیت: پلتفرم جامع آنلاین</span>
        <span class="badge" id="countBadge" style="background:#e2e8f0; color:#334155;">۰ مورد</span>
      </div>
      <div class="btn-group">
        <button class="btn-admin" onclick="openAdminModal()">⚙️ مدیریت اقامتگاه‌ها</button>
        <button class="btn-host" onclick="openHostModal()">➕ ثبت اقامتگاه جدید</button>
      </div>
    </div>

    <!-- بخش جستجو و فیلتر -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجوی شهر یا نام اقامتگاه..." oninput="filterProperties()" />
      <select id="provinceSelect" onchange="filterProperties()">
        <option value="">همه استان‌ها</option>
      </select>
      <button onclick="filterProperties()">جستجو</button>
      <button onclick="resetFilters()" style="background:#334155">پاک‌کردن</button>
    </div>

    <!-- لیست اقامتگاه‌ها -->
    <div class="grid" id="propertyGrid"></div>
  </div>

  <!-- مودال ثبت اقامتگاه جدید (میزبان) -->
  <div class="modal" id="hostModal">
    <div class="modal-content">
      <h3>ثبت اقامتگاه جدید توسط میزبان</h3>
      <form id="hostForm" onsubmit="saveProperty(event)">
        <div class="form-group">
          <label>نام اقامتگاه:</label>
          <input type="text" id="propTitle" required placeholder="مثلاً: بوم‌گردی باران" />
        </div>
        <div class="form-group">
          <label>استان:</label>
          <input type="text" id="propProvince" required placeholder="مثلاً: مازندران" />
        </div>
        <div class="form-group">
          <label>شهر / منطقه:</label>
          <input type="text" id="propLocation" required placeholder="مثلاً: رامسر، جواهرده" />
        </div>
        <div class="form-group">
          <label>قیمت هر شب (به تومان):</label>
          <input type="text" id="propPrice" required placeholder="مثلاً: ۱,۴۰۰,۰۰۰ تومان" />
        </div>
        <div class="form-group">
          <label>لینک عکس (آدرس اینترنتی تصویر):</label>
          <input type="url" id="propImage" required placeholder="https://..." />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeHostModal()">انصراف</button>
          <button type="submit" class="btn-submit">ثبت و انتشار</button>
        </div>
      </form>
    </div>
  </div>

  <!-- مودال پنل مدیریت مدیر (حذف و نظارت) -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <h3>پنل مدیریت پلتفرم (حذف اقامتگاه‌ها)</h3>
      <div id="adminList" style="max-height: 50vh; overflow-y: auto; margin-top: 1rem;"></div>
      <div class="modal-actions" style="margin-top: 1.5rem;">
        <button type="button" class="btn-cancel" onclick="closeAdminModal()">بستن</button>
      </div>
    </div>
  </div>

  <script>
    const defaultProperties = [
      {
        id: 1,
        title: "اقامتگاه بوم‌گردی ناردشت",
        province: "مازندران",
        location: "سوادکوه، زیراب",
        price: "۱,۲۰۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1587061949409-02df41d5e562?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 2,
        title: "اقامتگاه سنتی عمو رحمان",
        province: "اصفهان",
        location: "کاشان، بافت تاریخی",
        price: "۹۵۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1590490360182-c33d57733427?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 3,
        title: "کلبه چوبی جنگلی هیرکانی",
        province: "گیلان",
        location: "ماسال، اول بلنگاه",
        price: "۱,۵۰۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 4,
        title: "اقامتگاه بوم‌گردی آتشونی",
        province: "خراسان جنوبی",
        location: "روستای گرمه، طبس",
        price: "۸۰۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&auto=format&fit=crop&q=80"
      }
    ];

    let properties = JSON.parse(localStorage.getItem("iranja_properties")) || defaultProperties;

    const els = {
      grid: document.getElementById("propertyGrid"),
      searchInput: document.getElementById("searchInput"),
      provinceSelect: document.getElementById("provinceSelect"),
      countBadge: document.getElementById("countBadge"),
      hostModal: document.getElementById("hostModal"),
      adminModal: document.getElementById("adminModal"),
      adminList: document.getElementById("adminList")
    };

    function normalizeStr(s){
      return (s ?? "").toString().trim().toLowerCase();
    }

    function renderList(list) {
      els.countBadge.textContent = `${list.length} مورد`;

      if (list.length === 0) {
        els.grid.innerHTML = '<div class="empty-state">موردی مطابق با جستجوی شما یافت نشد.</div>';
        return;
      }

      els.grid.innerHTML = list.map(item => `
        <div class="card">
          <img src="${item.image}" alt="${item.title}" loading="lazy">
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-location">📍 ${item.location} (${item.province})</div>
            <div class="card-price">${item.price}</div>
            <a href="javascript:void(0)" class="btn-reserve" onclick="reserve(${item.id})">درخواست رزرو</a>
          </div>
        </div>
      `).join("");
    }

    function filterProperties() {
      const keyword = normalizeStr(els.searchInput.value);
      const province = (els.provinceSelect.value ?? "").toString().trim();

      const filtered = properties.filter(item => {
        const title = normalizeStr(item.title);
        const location = normalizeStr(item.location);
        const prov = (item.province ?? "").toString().trim();

        const matchKeyword = !keyword || title.includes(keyword) || location.includes(keyword) || prov.toLowerCase().includes(keyword);
        const matchProvince = !province || prov === province;

        return matchKeyword && matchProvince;
      });

      renderList(filtered);
    }

    function resetFilters(){
      els.searchInput.value = "";
      els.provinceSelect.value = "";
      renderList(properties);
    }

    // سیستم رزرو با اتصال مستقیم به شماره تماس شما
    function reserve(id) {
      const selected = properties.find(p => p.id === id);
      if (!selected) return;

      const name = selected.title;
      alert(`درخواست رزرو برای: «${name}» ثبت شد.\n\n` +
            `📞 جهت هماهنگی نهایی و پرداخت، لطفاً با مدیر پلتفرم (آقای برخورداری) تماس بگیرید:\n` +
            `09371880982`);
    }

    // کنترل مودال ثبت اقامتگاه
    function openHostModal() { els.hostModal.style.display = "flex"; }
    function closeHostModal() { els.hostModal.style.display = "none"; }

    function saveProperty(e) {
      e.preventDefault();
      const newProp = {
        id: Date.now(),
        title: document.getElementById("propTitle").value,
        province: document.getElementById("propProvince").value,
        location: document.getElementById("propLocation").value,
        price: document.getElementById("propPrice").value + " / هر شب",
        image: document.getElementById("propImage").value
      };

      properties.unshift(newProp);
      localStorage.setItem("iranja_properties", JSON.stringify(properties));
      
      closeHostModal();
      document.getElementById("hostForm").reset();
      fillProvinceOptions();
      renderList(properties);
      alert("اقامتگاه شما با موفقیت ثبت و روی سایت منتشر شد!");
    }

    // کنترل پنل مدیریت مدیر
    function openAdminModal() {
      renderAdminList();
      els.adminModal.style.display = "flex";
    }
    function closeAdminModal() { els.adminModal.style.display = "none"; }

    function renderAdminList() {
      if (properties.length === 0) {
        els.adminList.innerHTML = '<p style="text-align:center; color:#64748b;">هیچ اقامتگاهی ثبت نشده است.</p>';
        return;
      }

      els.adminList.innerHTML = properties.map(item => `
        <div class="admin-item">
          <span><b>${item.title}</b> (${item.province})</span>
          <button class="btn-delete-prop" onclick="deleteProperty(${item.id})">حذف</button>
        </div>
      `).join("");
    }

    function deleteProperty(id) {
      if (confirm("آیا از حذف این اقامتگاه مطمئن هستید؟")) {
        properties = properties.filter(p => p.id !== id);
        localStorage.setItem("iranja_properties", JSON.stringify(properties));
        renderAdminList();
        fillProvinceOptions();
        renderList(properties);
      }
    }

    function fillProvinceOptions(){
      const currentVal = els.provinceSelect.value;
      const provinces = Array.from(new Set(properties.map(x => x.province))).sort((a,b)=>a.localeCompare(b,"fa"));
      
      els.provinceSelect.innerHTML = '<option value="">همه استان‌ها</option>';
      provinces.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        els.provinceSelect.appendChild(opt);
      });
      els.provinceSelect.value = currentVal;
    }

    // راه‌اندازی اولیه
    fillProvinceOptions();
    renderList(properties);
  </script>
</body>
</html>
