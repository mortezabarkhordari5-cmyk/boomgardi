<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ایران‌جا | سامانه جامع بوم‌گردی ایران</title>

  <!-- فونت وزیرمتن -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8fafc; color: #1e293b; direction: rtl; }
    header { background: #0f766e; color: white; padding: 1.5rem; text-align: center; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    header p { font-size: 0.95rem; opacity: 0.9; }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .search-box {
      background: white; padding: 1rem; border-radius: 12px;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
      display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;
      align-items: center;
    }

    .search-box input, .search-box select {
      flex: 1; min-width: 200px;
      padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 1rem; outline: none;
    }

    .search-box button {
      background: #0d9488; color: white; border: none; padding: 0.75rem 1.5rem;
      border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
      white-space: nowrap;
    }
    .search-box button:hover { background: #0f766e; }

    .statusbar{
      margin-bottom: 1.25rem;
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: center;
      color:#475569;
      font-size: .95rem;
    }
    .badge{
      background:#dcfce7; color:#166534;
      padding:.35rem .6rem;
      border-radius: 999px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgb(0 0 0 / 0.08); transition: transform 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-4px); }

    .card img { width: 100%; height: 180px; object-fit: cover; background: #cbd5e1; }
    .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }

    .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; color: #0f172a; }
    .card-location { font-size: 0.85rem; color: #64748b; margin-bottom: 0.8rem; }
    .card-price { font-size: 1.1rem; font-weight: bold; color: #0d9488; margin-top: auto; margin-bottom: 1rem; }

    .btn-reserve {
      display: block; width: 100%; text-align: center;
      background: #f0fdfa; color: #0d9488; border: 1px solid #0d9488;
      padding: 0.6rem; border-radius: 8px; text-decoration: none;
      font-weight: bold; transition: all 0.2s;
    }
    .btn-reserve:hover { background: #0d9488; color: white; }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem; color: #64748b; font-size: 1.1rem; }
  </style>
</head>

<body>
  <header>
    <h1>ایران‌جا 🌲</h1>
    <p>رزرو اقامتگاه‌های بوم‌گردی و سنتی در سراسر ایران</p>
  </header>

  <div class="container">
    <!-- بخش جستجو و فیلتر -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجوی شهر یا نام اقامتگاه..." oninput="filterProperties()" />
      <select id="provinceSelect" onchange="filterProperties()">
        <option value="">همه استان‌ها</option>
      </select>
      <button onclick="filterProperties()">جستجو</button>
      <button onclick="resetFilters()" style="background:#334155">پاک‌کردن</button>
    </div>

    <!-- وضعیت اتصال -->
    <div class="statusbar">
      <span class="badge">وضعیت: آماده و فعال (آفلاین)</span>
      <span class="badge" id="countBadge" style="background:#e2e8f0; color:#334155;">۰ مورد</span>
    </div>

    <!-- لیست اقامتگاه‌ها -->
    <div class="grid" id="propertyGrid"></div>
  </div>

  <script>
    // اطلاعات اقامتگاه‌ها مستقیماً داخل خود سایت (بدون نیاز به سوپابیس)
    const properties = [
      {
        id: 1,
        title: "اقامتگاه بوم‌گردی ناردشت",
        province: "مازندران",
        location: "سوادکوه، زیراب",
        price: "۱,۲۰۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1587061949409-02df41d5e562?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 2,
        title: "اقامتگاه سنتی عمو رحمان",
        province: "اصفهان",
        location: "کاشان، بافت تاریخی",
        price: "۹۵۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1590490360182-c33d57733427?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 3,
        title: "کلبه چوبی جنگلی هیرکانی",
        province: "گیلان",
        location: "ماسال، اول بلنگاه",
        price: "۱,۵۰۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 4,
        title: "اقامتگاه بوم‌گردیه آتشونی",
        province: "خراسان جنوبی",
        location: "روستای گرمه، طبس",
        price: "۸۰۰,۰۰۰ تومان / هر شب",
        image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&auto=format&fit=crop&q=80"
      }
    ];

    const els = {
      grid: document.getElementById("propertyGrid"),
      searchInput: document.getElementById("searchInput"),
      provinceSelect: document.getElementById("provinceSelect"),
      countBadge: document.getElementById("countBadge"),
    };

    function normalizeStr(s){
      return (s ?? "").toString().trim().toLowerCase();
    }

    function renderList(list) {
      els.countBadge.textContent = `${list.length} مورد`;

      if (list.length === 0) {
        els.grid.innerHTML = '<div class="empty-state">موردی مطابق با جستجوی شما یافت نشد.</div>';
        return;
      }

      els.grid.innerHTML = list.map(item => `
        <div class="card">
          <img src="${item.image}" alt="${item.title}" loading="lazy">
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-location">📍 ${item.location}</div>
            <div class="card-price">${item.price}</div>
            <a href="javascript:void(0)" class="btn-reserve" onclick="reserve(${item.id})">درخواست رزرو</a>
          </div>
        </div>
      `).join("");
    }

    function filterProperties() {
      const keyword = normalizeStr(els.searchInput.value);
      const province = (els.provinceSelect.value ?? "").toString().trim();

      const filtered = properties.filter(item => {
        const title = normalizeStr(item.title);
        const location = normalizeStr(item.location);
        const prov = (item.province ?? "").toString().trim();

        const matchKeyword = !keyword || title.includes(keyword) || location.includes(keyword) || prov.toLowerCase().includes(keyword);
        const matchProvince = !province || prov === province;

        return matchKeyword && matchProvince;
      });

      renderList(filtered);
    }

    function resetFilters(){
      els.searchInput.value = "";
      els.provinceSelect.value = "";
      renderList(properties);
    }

    function reserve(id) {
      const selected = properties.find(p => p.id === id);
      const name = selected ? selected.title : "این اقامتگاه";
      alert(`درخواست رزرو برای: «${name}» ثبت شد.\nبه‌زودی با شما تماس گرفته می‌شود.`);
    }

    function fillProvinceOptions(){
      const provinces = Array.from(new Set(properties.map(x => x.province))).sort((a,b)=>a.localeCompare(b,"fa"));
      provinces.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        els.provinceSelect.appendChild(opt);
      });
    }

    // راه‌اندازی اولیه
    fillProvinceOptions();
    renderList(properties);
  </script>
</body>
</html>
